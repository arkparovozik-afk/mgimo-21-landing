name: Deploy both landing versions
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -- --base=/mgimo-21-landing/feedback/
      - uses: actions/checkout@v4
        with:
          ref: 328fe3909f2f7f33c335696b739b70b9eba1a9f5
          path: original-version
      - run: npm ci
        working-directory: original-version
      - run: npm run build -- --base=/mgimo-21-landing/
        working-directory: original-version
      - run: cp -R dist original-version/dist/feedback
      - uses: actions/upload-pages-artifact@v3
        with:
          path: original-version/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
